name: launcher_core
description: MacLauncher listener-side core components (pure Dart, Flutter-free).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # E12: used by chunked_downloader.dart for whole-payload sha256
  # verification. 3.0.7 was already pinned in the workspace lockfile as a
  # transitive dependency; this only promotes it to a direct dependency,
  # so pubspec.lock is unchanged.
  crypto: ^3.0.7
  maclauncher_sdk: ^0.1.0

dev_dependencies:
  # Tests drive the controlled SDK peer from example/ (handshake and
  # autostart scenarios).
  minimal_app: ^0.1.0
  test: ^1.25.0
