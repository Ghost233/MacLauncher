name: Check (format / analyze / test)

# PR 与 main 推送的护栏：复用 scripts/check-flutter.sh（format → analyze → test），
# 让格式/静态检查/测试在进 main 之前就红，而不是在发布或后续分支 rebase 时才暴露。
# Flutter 版本与 macos-15 runner 的钉版理由同 build-macos-dmg.yml 头部注释。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FLUTTER_VERSION: "3.47.6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        # 根目录是 pub workspace（launcher/ 为成员，resolution: workspace），
        # 依赖解析必须在仓库根执行。
        run: flutter pub get --enforce-lockfile

      - name: Format / analyze / test
        run: bash scripts/check-flutter.sh
