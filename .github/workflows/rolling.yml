name: Rolling (latest)

# 合入 main 触发滚动构建：
# 同一构建打包管线，滚动更新名为 latest 的 Release（--clobber 覆盖旧 asset）。
# latest tag 每次随 main 前移（force-update），Release 页 source 快照即当前 main。
# latest 是普通 Release（非 prerelease），但 --latest=false 把 Latest 徽章
# 留给打 tag 的正式发布（release.yml），见 CONTEXT.md「滚动构建」。

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rolling-latest
  cancel-in-progress: false

env:
  ROLLING_TAG: latest

jobs:
  build:
    # 不传 version：可复用管线的缺省值即 latest（GitHub 不允许在调用方
    # job 的 with 里引用 env 上下文，故由被调方缺省值承载滚动名）。
    uses: ./.github/workflows/build-macos-dmg.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: maclauncher-dmg-${{ env.ROLLING_TAG }}
          path: dist

      - name: Rolling-update latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # latest tag 随 main 前移：gh release edit --target 对已有 tag 无效
          # （GitHub 仅在 tag 不存在时才用 target_commitish 建 tag），因此先
          # force-move tag 到当前 commit，再覆盖 asset，保证 Release 页 source
          # 快照与 notes 声称的 main@SHA 一致。
          # latest 不匹配 release.yml 的 v* 触发模式，本次推 tag 不会引发正式发布。
          git tag -f "$ROLLING_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$ROLLING_TAG"
          # 首次没有 latest 时创建；之后每次用 --clobber 覆盖同名 asset。
          if ! gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release create "$ROLLING_TAG" \
              --latest=false \
              --title "$ROLLING_TAG (rolling)" \
              --notes "滚动构建：随 main 更新；latest tag 随 main 前移，source 快照即当前 main。"
          fi
          gh release upload "$ROLLING_TAG" dist/* --clobber
          # --prerelease=false 把历史遗留的 prerelease 标记翻正；--latest=false
          # 保证 Latest 徽章始终留在打 tag 的正式发布上。
          gh release edit "$ROLLING_TAG" --prerelease=false --latest=false \
            --notes "滚动构建：main@${GITHUB_SHA:0:7}（$(date -u +%Y-%m-%d) UTC 构建）。latest tag 随 main 前移，source 快照即当前 main。DMG 未签名，完整性核对见 SHA256SUMS.txt。"
